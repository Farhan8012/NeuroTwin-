# NeuroTwin — Docker Compose
# Starts Qdrant + FastAPI + Web Dashboard + Monitoring in one command.
#
# Usage:
#   docker compose up --build
#   docker compose down
#   docker compose ps
#
# Services:
#   - Qdrant:     Vector database (port 6333)
#   - Backend:    FastAPI AI pipeline (port 8000)
#   - Web:        Nginx static dashboard (port 5500)
#   - Prometheus: Metrics collection (port 9090)
#   - Grafana:    Monitoring dashboards (port 3000)
#
# Ollama runs on the host machine and is accessed via host.docker.internal.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      FACE_MATCH_THRESHOLD: "0.50"
      WHISPER_MODEL: base
      NEUROTWIN_API_KEY: ""
    volumes:
      - backend_data:/app/data
      - backend_static:/app/static
      - backend_models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: neurotwin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_data:
  backend_data:
  backend_static:
  backend_models:
  prometheus_data:
  grafana_data:
